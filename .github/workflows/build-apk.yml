name: Build Debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify active Java version
        run: java -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1 and build tools
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Build debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify debug APK
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Verified debug APK was not found at ${APK_PATH}."
            exit 1
          fi
          if ! unzip -tq "$APK_PATH" >/dev/null 2>&1; then
            echo "::error::Generated APK at ${APK_PATH} is not a valid archive."
            exit 1
          fi
          APK_FILENAME="$(basename "$APK_PATH")"
          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "apk_filename=${APK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Verified debug APK: ${APK_PATH} ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vice-Horizon-APK
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Prepare release metadata
        id: release_meta
        run: |
          RELEASE_TAG="v1.0-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Vice Horizon Debug APK (Build #${GITHUB_RUN_NUMBER})"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${{ steps.release_meta.outputs.release_tag }}"
          RELEASE_TITLE="${{ steps.release_meta.outputs.release_title }}"
          APK_PATH="${{ steps.verify_apk.outputs.apk_path }}"

          set +e
          RELEASE_OUTPUT=$(gh release create "$RELEASE_TAG" "$APK_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "Automated debug APK build for commit ${GITHUB_SHA}." \
            --latest 2>&1)
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::warning::GitHub Release publishing failed for tag ${RELEASE_TAG}: ${RELEASE_OUTPUT}"
            exit 1
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_NAME="Vice-Horizon-APK"
          RELEASE_TAG="${{ steps.release_meta.outputs.release_tag }}"
          APK_FILENAME="${{ steps.verify_apk.outputs.apk_filename }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_TITLE=$(gh release view "$RELEASE_TAG" --json name --jq '.name')
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            ASSET_NAME=$(gh release view "$RELEASE_TAG" --json assets --jq ".assets[] | select(.name == \"${APK_FILENAME}\") | .name" | head -n 1)
            ASSET_URL=$(gh release view "$RELEASE_TAG" --json assets --jq ".assets[] | select(.name == \"${APK_FILENAME}\") | .url" | head -n 1)

            echo "Release published successfully."
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            if [ -n "$ASSET_URL" ]; then
              echo "Direct APK Download URL: ${ASSET_URL}"
            fi
            echo "You can download the APK from the release Assets section on the GitHub Release page."
            echo "The normal Actions artifact (${ARTIFACT_NAME}) is also available as a backup."

            {
              echo "### APK Build & Release Succeeded"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page URL:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              if [ -n "$ASSET_URL" ]; then
                echo "- **Direct APK Download URL:** ${ASSET_URL}"
              fi
              echo "- Download the APK directly from the **Assets** section on the release page above."
              echo "- The normal Actions artifact (\`${ARTIFACT_NAME}\`) is also available on this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.upload_artifact.outcome }}" = "success" ]; then
            echo "::warning::GitHub Release publishing failed, but the APK build and artifact upload succeeded."
            echo "APK build succeeded."
            echo "The Actions artifact named ${ARTIFACT_NAME} remains available on this workflow run."

            {
              echo "### APK Build Succeeded (Release Publishing Warning)"
              echo "> **Warning:** GitHub Release publishing failed. Do not expect a published release for this run."
              echo "- **APK Build Status:** Succeeded"
              echo "- **Actions Artifact Backup:** Available under the name \`${ARTIFACT_NAME}\` in this workflow run's **Artifacts** section."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::APK build or artifact upload failed."
            {
              echo "### APK Build Failed"
              echo "- The debug APK build or artifact upload did not complete successfully."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
